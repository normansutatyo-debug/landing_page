<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A simple landing page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="div-header">
        <div class="div-header-row1">
            <span id="header_logo">Header Logo</span>
            <ul>
                <li> <a href="#">header link one</a> </li>
                <li> <a href="#">header link two</a> </li>
                <li> <a href="#">header link three</a> </li>
            </ul>
        </div>
        <div class="div-header-row2">
            <div class="div-header-column">
                <div id="hero_main_text">This website is awesome</div>
                <div id="hero_secondary_text">
                    This website has some subtext that goes here under the main title. It's a smaller font and the color
                    is
                    lower
                    contrast.

    </div>
